name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x glassbill/gradlew

      - name: Run unit tests
        working-directory: glassbill
        run: ./gradlew testDebugUnitTest --max-workers=2

      - name: Assemble debug APK
        working-directory: glassbill
        run: ./gradlew assembleDebug --max-workers=2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: glassbill-debug
          path: glassbill/app/build/outputs/apk/debug/*.apk